name: LWJGL3 Android natives

# Builds bionic-linked LWJGL3 natives for Android from AngelAuraMC/lwjgl3's Android recipe
# (.github/workflows/build-android.yml + ci_build_android.bash on each version's rebase branch)
# and publishes them as a GitHub Release in this repo, one tag per LWJGL version
# (`lwjgl-<version>-android`). We build from source in our own CI instead of re-hosting someone
# else's compiled output, same as feeldev12/nerion-android-jdk-build.
#
# WHY: Maven Central's org.lwjgl:*:natives-linux-arm64 jars are linked against glibc SONAMEs
# (libpthread.so.0, libc.so.6, ...) that Android's bionic libc doesn't have, so they fail with
# `dlopen failed: library "libpthread.so.0" not found`.
#
# Runs by hand only (workflow_dispatch), one LWJGL version per run, so editing this file never
# republishes a release by accident. Known-good inputs:
#   3.3.3: ref 6a564a8b4b1438699e9d7ccb42548e4ba454fd30 (wip/rebase_3.3.3), jdk 21
#   3.4.1: ref 702c2102a2876cdf67d1d57f6819fa2d458217d9 (wip/rebase_3.4.1, upstream CI green 2026-07-08), jdk 25
#
# Besides the LWJGL natives (lwjgl, opengl, stb, freetype, tinyfd, vma, ... + libshaderc, which the
# recipe downloads from AngelAuraMC/shaderc), the release carries `libspirv-cross.so`: the
# SPIRV-Cross C API LWJGL's spvc module loads, built here from KhronosGroup/SPIRV-Cross. Minecraft
# 26.2+ loads shaderc, vma and spvc at startup even when rendering with OpenGL.
#
# Every .so is renamed `{stem}-{android-abi}.so` (e.g. `liblwjgl-arm64-v8a.so`), the ABI names
# app-launcher's Rust side uses, with a `.sha256` sidecar it verifies before writing the file.

on:
  workflow_dispatch:
    inputs:
      lwjgl_version:
        description: LWJGL version (release tag becomes lwjgl-<version>-android)
        required: true
        default: "3.4.1"
      reference_ref:
        description: AngelAuraMC/lwjgl3 commit to build (pin a commit, not a branch)
        required: true
        default: "702c2102a2876cdf67d1d57f6819fa2d458217d9"
      jdk:
        description: JDK the recipe builds with (JDK 8 is always installed too, as JAVA8_HOME)
        required: true
        default: "25"
      spirv_cross_ref:
        description: KhronosGroup/SPIRV-Cross tag for libspirv-cross.so
        required: true
        default: "vulkan-sdk-1.4.341.0"

permissions:
  contents: write

env:
  REFERENCE_REPO: AngelAuraMC/lwjgl3
  LWJGL_VERSION: ${{ inputs.lwjgl_version }}
  REFERENCE_REF: ${{ inputs.reference_ref }}

jobs:
  build:
    name: "Build LWJGL ${{ inputs.lwjgl_version }} ${{ matrix.arch }} (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: arm32
            abi: armeabi-v7a
          - arch: x86
            abi: x86
          - arch: x64
            abi: x86_64

    steps:
      - name: Checkout reference build recipe (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REFERENCE_REPO }}
          ref: ${{ env.REFERENCE_REF }}
          path: reference-build

      - name: Set up JDK 8 + ${{ inputs.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            ${{ inputs.jdk }}

      - name: Build LWJGL for Android ${{ matrix.arch }}
        working-directory: reference-build
        run: |
          export JAVA8_HOME=$JAVA_HOME_8_${{ runner.arch }}
          export LWJGL_BUILD_ARCH=${{ matrix.arch }}
          bash ci_build_android.bash

      - name: Rename outputs to our stable naming scheme + compute sha256
        working-directory: reference-build/bin/out
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/publish/${{ matrix.abi }}"
          shopt -s nullglob
          for f in *.so; do
            stem="${f%.so}"
            out="$GITHUB_WORKSPACE/publish/${{ matrix.abi }}/${stem}-${{ matrix.abi }}.so"
            cp "$f" "$out"
            sha256sum "$out" | awk '{print $1}' > "$out.sha256"
          done
          ls -la "$GITHUB_WORKSPACE/publish/${{ matrix.abi }}"

      - name: Upload native build output
        uses: actions/upload-artifact@v4
        with:
          name: "lwjgl-${{ env.LWJGL_VERSION }}-android-${{ matrix.abi }}"
          path: publish/${{ matrix.abi }}

  spirv-cross:
    name: "Build SPIRV-Cross C API (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - name: Checkout SPIRV-Cross
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Cross
          ref: ${{ inputs.spirv_cross_ref }}
          path: spirv-cross

      - name: Build libspirv-cross-c-shared with the NDK
        working-directory: spirv-cross
        run: |
          set -euo pipefail
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_CROSS_SHARED=ON \
            -DSPIRV_CROSS_STATIC=OFF \
            -DSPIRV_CROSS_CLI=OFF \
            -DSPIRV_CROSS_ENABLE_TESTS=OFF
          cmake --build build -j"$(nproc)"
          lib=$(find build -maxdepth 1 -name 'libspirv-cross-c-shared.so*' -type f | head -n1)
          test -n "$lib"
          # LWJGL's spvc module loads it by this name (org.lwjgl.util.spvc.Spvc: "spirv-cross").
          mkdir -p "$GITHUB_WORKSPACE/publish"
          out="$GITHUB_WORKSPACE/publish/libspirv-cross-${{ matrix.abi }}.so"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -o "$out" "$lib"
          sha256sum "$out" | awk '{print $1}' > "$out.sha256"
          ls -la "$GITHUB_WORKSPACE/publish"

      - name: Upload SPIRV-Cross output
        uses: actions/upload-artifact@v4
        with:
          name: "lwjgl-${{ env.LWJGL_VERSION }}-android-spirv-cross-${{ matrix.abi }}"
          path: publish

  publish:
    name: Publish GitHub Release
    needs: [build, spirv-cross]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: lwjgl-${{ inputs.lwjgl_version }}-android
    steps:
      - name: Download all per-ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "lwjgl-${{ env.LWJGL_VERSION }}-android-*"
          path: artifacts

      - name: Flatten artifacts for release upload
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.so' -o -name '*.so.sha256' \) -exec cp {} release/ \;
          ls -la release

      - name: Publish natives to a stable public GitHub Release
        # Re-running for the same version replaces that release's assets in place.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "LWJGL ${{ env.LWJGL_VERSION }} Android natives (bionic)"
          body: |
            Self-built, bionic-linked LWJGL ${{ env.LWJGL_VERSION }} Android native libraries, one
            set per ABI (arm64-v8a, armeabi-v7a, x86, x86_64), plus libspirv-cross (SPIRV-Cross C
            API, ${{ inputs.spirv_cross_ref }}) for LWJGL's spvc module.

            Built from ${{ env.REFERENCE_REPO }}@${{ env.REFERENCE_REF }} and
            KhronosGroup/SPIRV-Cross@${{ inputs.spirv_cross_ref }} by this repo's
            `.github/workflows/lwjgl3-android.yml` (run ${{ github.run_id }}).
          draft: false
          prerelease: false
          files: |
            release/*.so
            release/*.so.sha256
